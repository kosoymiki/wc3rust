<text x="250" y="283" font-family="monospace" font-size="14" font-weight="400" fill="#e5edf8" text-anchor="start">pointer router → gesture recognizer → RTS adapter → semantic commands</text>
<rect x="80" y="330" width="1120" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
<text x="100" y="353" font-family="monospace" font-size="17" font-weight="700" fill="#38bdf8" text-anchor="start">SIMULATION</text>
<text x="250" y="353" font-family="monospace" font-size="14" font-weight="400" fill="#e5edf8" text-anchor="start">fixed 20/30 Hz · ECS · orders · pathfinding · combat · fog · replay</text>
