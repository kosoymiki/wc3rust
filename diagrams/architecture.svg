<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#0b1220"/>
<text x="40" y="52" font-family="monospace" font-size="30" font-weight="700" fill="#e5edf8" text-anchor="start">ARCHITECTURE — layers and data flow</text>
<text x="40" y="82" font-family="monospace" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">wc3rust — clean-room Rust/Vulkan WC3-compatible RTS · plan 2026-11-12</text>
<rect x="80" y="120" width="1120" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
<text x="100" y="143" font-family="monospace" font-size="17" font-weight="700" fill="#38bdf8" text-anchor="start">APPS</text>
<text x="250" y="143" font-family="monospace" font-size="14" font-weight="400" fill="#e5edf8" text-anchor="start">SDL3 window/input/audio · Android/Windows/Linux · CLI tools</text>
<rect x="80" y="190" width="1120" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
<text x="100" y="213" font-family="monospace" font-size="17" font-weight="700" fill="#38bdf8" text-anchor="start">LAUNCHER + UI</text>
