<line x1="640" y1="524" x2="640" y2="540" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="594" x2="640" y2="610" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="664" x2="640" y2="680" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
