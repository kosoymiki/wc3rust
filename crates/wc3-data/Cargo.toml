[package]
name = "wc3-data"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Typed Warcraft III game data database"

[dependencies]
wc3-formats = { path = "../wc3-formats" }
libc = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dump_gamedata"
path = "src/bin/dump_gamedata.rs"

[dev-dependencies]
wc3-mpq = { path = "../wc3-mpq" }
