name: HUD Artisan
on:
  push:
    paths:
      - "tools/hud_artisan/**"
      - "crates/wc3-formats/**"
      - "crates/wc3-game/**"
      - "crates/wc3-core/**"
      - "crates/wc3-mpq/**"
      - "crates/wc3-re/**"
      - "crates/wc3-assetdb/**"
      - "crates/wc3-audio/**"
      - "crates/wc3-data/**"
      - "crates/wc3-path/**"
      - "crates/wc3-sim/**"
      - "crates/wc3-anim/**"
      - "crates/wc3-render/**"
      - "crates/wc3-input/**"
      - "crates/wc3-bink/**"
      - "tools/hud_pack_check.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hud-artisan.yml"
  pull_request:
    paths:
      - "tools/hud_artisan/**"
      - ".github/workflows/hud-artisan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # setup-python v7
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install -r tools/hud_artisan/requirements.txt
      - run: python -m compileall -q tools/hud_artisan
      - run: python -m unittest discover -s tools/hud_artisan -p 'test_*.py' -v
  hud-pack-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - name: Compile and run HUD pack loader regression tests
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/crates"
          for crate in wc3-game wc3-core wc3-formats wc3-mpq wc3-re wc3-assetdb wc3-audio wc3-data wc3-path wc3-sim wc3-anim wc3-render wc3-input wc3-bink; do
            cp -R "crates/$crate" "$tmp/crates/"
          done
          cat > "$tmp/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "crates/wc3-game", "crates/wc3-core", "crates/wc3-formats",
            "crates/wc3-mpq", "crates/wc3-re", "crates/wc3-assetdb",
            "crates/wc3-audio", "crates/wc3-data", "crates/wc3-path",
            "crates/wc3-sim", "crates/wc3-anim", "crates/wc3-render",
            "crates/wc3-input", "crates/wc3-bink"
          ]
          [workspace.package]
          version = "0.1.0"
          edition = "2024"
          license = "MIT OR Apache-2.0"
          [workspace.dependencies]
          glam = "0.30"
          wgpu = "30.0.1"
          pollster = "0.4"
          libc = "0.2"
          flate2 = "1"
          bzip2 = "0.5"
          EOF
          cargo test --manifest-path "$tmp/Cargo.toml" -p wc3-game --lib hudskin::pack::tests::pack_file_rejects_traversal_and_symlink_components
          cargo test --manifest-path "$tmp/Cargo.toml" -p wc3-game --lib hudskin::pack::tests::atlas_validator_rejects_bounds_overlap_and_duplicate_ids
          cargo test --manifest-path "$tmp/Cargo.toml" -p wc3-game --lib hudskin::pack::tests::numeric_manifest_helpers_reject_invalid_values

  blp-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      # The upstream workspace currently references optional crates absent from this
      # branch snapshot. Build the real format crates in an isolated minimal workspace
      # so Cargo does not need to resolve unrelated engine members.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # setup-python v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/hud_artisan/requirements.txt
      - name: Compile BLP decoder example
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/crates"
          cp -R crates/wc3-formats "$tmp/crates/"
          cp -R crates/wc3-mpq "$tmp/crates/"
          cat > "$tmp/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/wc3-formats", "crates/wc3-mpq"]
          [workspace.package]
          version = "0.1.0"
          edition = "2024"
          license = "MIT OR Apache-2.0"
          [workspace.dependencies]
          glam = "0.30"
          flate2 = "1"
          EOF
          cargo check --manifest-path "$tmp/Cargo.toml" -p wc3-formats --example blp_dump_rgba
          mkdir -p "$tmp/roundtrip"
          python - "$tmp/roundtrip/source.png" <<'PY'
          from PIL import Image, ImageDraw
          import sys
          image = Image.new("RGBA", (32, 32), (0, 0, 0, 0))
          draw = ImageDraw.Draw(image)
          draw.rectangle((2, 2, 15, 29), fill=(196, 122, 38, 255))
          draw.rectangle((16, 2, 29, 29), fill=(42, 116, 82, 173))
          draw.rectangle((8, 8, 23, 23), fill=(218, 194, 132, 0))
          image.save(sys.argv[1])
          PY
          python tools/hud_artisan/blp_harness.py roundtrip \\
            --input "$tmp/roundtrip/source.png" \\
            --work "$tmp/roundtrip/work" \\
            --encode-arg "$(command -v python)" \\
            --encode-arg "$GITHUB_WORKSPACE/tools/png_to_blp1.py" \\
            --encode-arg "{input}" --encode-arg "{output}" \\
            --decode-arg cargo --decode-arg run --decode-arg --quiet \\
            --decode-arg --manifest-path --decode-arg "$tmp/Cargo.toml" \\
            --decode-arg -p --decode-arg wc3-formats --decode-arg --example \\
            --decode-arg blp_dump_rgba --decode-arg -- --decode-arg "{input}" \\
            --decode-arg "{output}" --decode-raw-rgba \\
            --report "$tmp/roundtrip/roundtrip.json"
          python - "$tmp/roundtrip/roundtrip.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["blp"]["format"] == "BLP1", report
          assert report["roundtrip"]["exact_match"], report["roundtrip"]
          assert report["roundtrip"]["alpha_silhouette_iou"] == 1.0, report["roundtrip"]
          print("REAL_RUST_BLP_ROUNDTRIP_PASS", report["roundtrip"])
          PY
