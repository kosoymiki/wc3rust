name: HUD Artisan
on:
  push:
    paths:
      - "tools/hud_artisan/**"
      - "crates/wc3-formats/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/hud-artisan.yml"
  pull_request:
    paths:
      - "tools/hud_artisan/**"
      - ".github/workflows/hud-artisan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # setup-python v7
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install -r tools/hud_artisan/requirements.txt
      - run: python -m compileall -q tools/hud_artisan
      - run: python -m unittest discover -s tools/hud_artisan -p 'test_*.py' -v
  blp-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      # The upstream workspace currently references optional crates absent from this
      # branch snapshot. Build the real format crates in an isolated minimal workspace
      # so Cargo does not need to resolve unrelated engine members.
      - name: Compile BLP decoder example
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/crates"
          cp -R crates/wc3-formats "$tmp/crates/"
          cp -R crates/wc3-mpq "$tmp/crates/"
          cat > "$tmp/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/wc3-formats", "crates/wc3-mpq"]
          [workspace.package]
          version = "0.1.0"
          edition = "2024"
          license = "MIT OR Apache-2.0"
          [workspace.dependencies]
          glam = "0.30"
          flate2 = "1"
          EOF
          cargo check --manifest-path "$tmp/Cargo.toml" -p wc3-formats --example blp_dump_rgba
