name: HUD Artisan
on:
  push:
    paths:
      - "tools/hud_artisan/**"
  pull_request:
    paths:
      - "tools/hud_artisan/**"
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/hud_artisan/requirements.txt
      - run: python -m unittest discover -s tools/hud_artisan -p 'test_*.py' -v
