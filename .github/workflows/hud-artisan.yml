name: HUD Artisan
on:
  push:
    paths:
      - "tools/hud_artisan/**"
      - ".github/workflows/hud-artisan.yml"
  pull_request:
    paths:
      - "tools/hud_artisan/**"
      - ".github/workflows/hud-artisan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install -r tools/hud_artisan/requirements.txt
      - run: python -m compileall -q tools/hud_artisan
      - run: python -m unittest discover -s tools/hud_artisan -p 'test_*.py' -v
