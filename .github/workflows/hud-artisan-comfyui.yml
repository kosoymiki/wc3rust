name: HUD Artisan — ComfyUI CPU render

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Draft renders one real HUD panel; full renders the complete 92-asset pack
        required: true
        type: choice
        options:
          - draft
          - full
        default: draft
      manifest:
        description: Authoritative production manifest (used only when scope=full)
        required: true
        default: analysis/hudskin/final/wc3rust-hud-final/manifest.json
      theme:
        description: HUD visual theme
        required: true
        type: choice
        options:
          - classic-modern
          - human-gold
          - orc-iron
          - undead-obsidian
        default: classic-modern
      seed:
        description: Deterministic batch seed
        required: true
        default: "20261119"

permissions:
  contents: read

concurrency:
  group: hud-artisan-comfyui
  cancel-in-progress: false

jobs:
  render:
    # Standard GitHub-hosted CPU runner only. ComfyUI is installed and launched with --cpu.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      COMFYUI_URL: ${{ secrets.COMFYUI_URL || 'http://127.0.0.1:8188' }}
      SCOPE: ${{ inputs.scope }}
      MANIFEST: ${{ inputs.scope == 'draft' && 'tools/hud_artisan/draft/manifest.json' || inputs.manifest }}
      THEME: ${{ inputs.theme }}
      SEED: ${{ inputs.seed }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Check selected manifest before downloading models
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MANIFEST" || { echo "::error::Manifest not found: $MANIFEST."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/hud_artisan/requirements.txt

      - name: Compile and validate the deterministic draft plan
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MANIFEST" || { echo "::error::Manifest not found: $MANIFEST"; exit 1; }
          python tools/hud_artisan/generate.py profile --out build/hud-artisan/engine-profile.json
          args=(--manifest "$MANIFEST" --out build/hud-artisan/jobs --theme "$THEME" --seed "$SEED")
          if [ "$SCOPE" = "full" ]; then args+=(--engine-contract); fi
          python tools/hud_artisan/generate.py plan "${args[@]}"
          if [ "$SCOPE" = "draft" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/hud-artisan/jobs/jobs.json")
          jobs=json.loads(p.read_text())
          if jobs.get("job_count") != 1 or len(jobs.get("jobs", [])) != 1:
              raise SystemExit(f"Draft manifest must compile to exactly one real asset job; got {jobs.get('job_count')}")
          job=jobs["jobs"][0]
          print(f"DRAFT_PLAN_OK asset={job['asset']} size={job['width']}x{job['height']} family={job['family']}")
          PY
          fi

      - name: Preflight private workflow and model secrets
        shell: bash
        env:
          MODEL_URL: ${{ secrets.HUD_COMFYUI_MODEL_URL }}
          MODEL_SHA256: ${{ secrets.HUD_COMFYUI_MODEL_SHA256 }}
          MODEL_ID: ${{ secrets.HUD_COMFYUI_MODEL }}
          MODEL_LICENSE: ${{ secrets.HUD_COMFYUI_LICENSE }}
          WORKFLOW_B64: ${{ secrets.HUD_COMFYUI_WORKFLOW_B64 }}
          CONFIG_B64: ${{ secrets.HUD_COMFYUI_CONFIG_B64 }}
        run: |
          set -euo pipefail
          for name in MODEL_URL MODEL_SHA256 MODEL_ID MODEL_LICENSE WORKFLOW_B64 CONFIG_B64; do
            test -n "${!name}" || { echo "::error::Missing required Actions secret for $name"; exit 1; }
          done
          [[ "$MODEL_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "::error::HUD_COMFYUI_MODEL_SHA256 must be 64 hexadecimal characters"; exit 1; }
          echo "Private workflow/model secret presence and checkpoint digest format verified."

      - name: Install HUD Artisan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/hud_artisan/requirements.txt

      - name: Install ComfyUI with CPU-only PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/Comfy-Org/ComfyUI.git /tmp/ComfyUI
          python -m pip install -r /tmp/ComfyUI/requirements.txt
          mkdir -p /tmp/ComfyUI/models/checkpoints

      - name: Download pinned checkpoint
        shell: bash
        env:
          MODEL_URL: ${{ secrets.HUD_COMFYUI_MODEL_URL }}
          MODEL_SHA256: ${{ secrets.HUD_COMFYUI_MODEL_SHA256 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MODEL_URL" || { echo "::error::Missing HUD_COMFYUI_MODEL_URL secret"; exit 1; }
          test -n "$MODEL_SHA256" || { echo "::error::Missing HUD_COMFYUI_MODEL_SHA256 secret"; exit 1; }
          name="$(basename "${MODEL_URL%%\?*}")"
          test -n "$name" && test "$name" != "/" || { echo "::error::Cannot infer checkpoint filename from URL"; exit 1; }
          if [ -n "${HF_TOKEN:-}" ]; then
            curl --fail --location --retry 3 -H "Authorization: Bearer $HF_TOKEN" "$MODEL_URL" -o "/tmp/ComfyUI/models/checkpoints/$name"
          else
            curl --fail --location --retry 3 "$MODEL_URL" -o "/tmp/ComfyUI/models/checkpoints/$name"
          fi
          echo "$MODEL_SHA256  /tmp/ComfyUI/models/checkpoints/$name" | sha256sum --check --status
          echo "COMFYUI_CHECKPOINT=$name" >> "$GITHUB_ENV"

      - name: Start ComfyUI in CPU mode
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ComfyUI
          python main.py --cpu --listen 127.0.0.1 --port 8188 > "$GITHUB_WORKSPACE/comfyui.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/comfyui.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:8188/system_stats >/dev/null; then
              echo "ComfyUI CPU API is ready."
              exit 0
            fi
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/comfyui.pid")" 2>/dev/null; then
              cat "$GITHUB_WORKSPACE/comfyui.log"
              echo "::error::ComfyUI exited during startup"
              exit 1
            fi
            sleep 5
          done
          cat "$GITHUB_WORKSPACE/comfyui.log"
          echo "::error::ComfyUI CPU startup timed out"
          exit 1

      - name: Verify ComfyUI API and private workflow secrets
        shell: bash
        env:
          WORKFLOW_B64: ${{ secrets.HUD_COMFYUI_WORKFLOW_B64 }}
          CONFIG_B64: ${{ secrets.HUD_COMFYUI_CONFIG_B64 }}
          MODEL_ID: ${{ secrets.HUD_COMFYUI_MODEL }}
          MODEL_LICENSE: ${{ secrets.HUD_COMFYUI_LICENSE }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_B64" || { echo "::error::Missing HUD_COMFYUI_WORKFLOW_B64 secret"; exit 1; }
          test -n "$CONFIG_B64" || { echo "::error::Missing HUD_COMFYUI_CONFIG_B64 secret"; exit 1; }
          test -n "$MODEL_ID" || { echo "::error::Missing HUD_COMFYUI_MODEL secret"; exit 1; }
          test -n "$MODEL_LICENSE" || { echo "::error::Missing HUD_COMFYUI_LICENSE secret"; exit 1; }
          mkdir -p build/hud-artisan/private
          printf '%s' "$WORKFLOW_B64" | base64 --decode > build/hud-artisan/private/comfyui_api_workflow.json
          printf '%s' "$CONFIG_B64" | base64 --decode > build/hud-artisan/private/comfyui.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("build/hud-artisan/private")
          cfg = json.loads((p / "comfyui.json").read_text())
          if cfg.get("schema_version") != 1:
              raise SystemExit("ComfyUI config must use schema_version=1")
          cfg["workflow_file"] = "comfyui_api_workflow.json"
          (p / "comfyui.json").write_text(json.dumps(cfg, indent=2) + "\n")
          workflow = json.loads((p / "comfyui_api_workflow.json").read_text())
          if not isinstance(workflow, dict) or not workflow:
              raise SystemExit("ComfyUI API workflow must be a non-empty object")
          checkpoint = os.environ.get("COMFYUI_CHECKPOINT", "")
          referenced = []
          for node in workflow.values():
              if isinstance(node, dict) and isinstance(node.get("inputs"), dict):
                  for key in ("ckpt_name", "checkpoint_name"):
                      if key in node["inputs"]:
                          referenced.append(str(node["inputs"][key]))
          if not checkpoint or checkpoint not in referenced:
              raise SystemExit(f"API workflow must reference the exact downloaded checkpoint filename {checkpoint!r}; found {referenced!r}")
          adapter = {"schema_version": 1, "name": "github-actions-comfyui-cpu", "provider": "ComfyUI", "model": os.environ["MODEL_ID"], "license": os.environ["MODEL_LICENSE"], "working_directory": "../..", "command": ["python", "tools/hud_artisan/comfyui_adapter.py", "--config", "build/hud-artisan/private/comfyui.json", "--job-json", "{job_json}", "--output", "{output_path}"], "environment": ["COMFYUI_URL"], "timeout_seconds": 1900, "retries": 1, "max_parallel": 1, "references": [], "postprocessing": []}
          Path("build/hud-artisan/adapter.json").write_text(json.dumps(adapter, indent=2) + "\n")
          PY
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["COMFYUI_URL"].rstrip("/")
          with urllib.request.urlopen(url + "/system_stats", timeout=15) as r:
              data = json.load(r)
          if not isinstance(data, dict) or "system" not in data:
              raise SystemExit("ComfyUI /system_stats returned an unexpected response")
          print("ComfyUI API is reachable; system stats received.")
          PY

      - name: Render selected jobs through ComfyUI
        run: |
          set -euo pipefail
          python tools/hud_artisan/generate.py dispatch \
            --manifest "$MANIFEST" \
            --jobs build/hud-artisan/jobs/jobs.json \
            --adapter build/hud-artisan/adapter.json \
            --drop build/hud-artisan/drop \
            --parallel 1

      - name: Ingest, validate and build production contact sheet
        if: inputs.scope == 'full'
        run: |
          set -euo pipefail
          python tools/hud_artisan/generate.py ingest \
            --manifest "$MANIFEST" \
            --jobs build/hud-artisan/jobs/jobs.json \
            --drop build/hud-artisan/drop \
            --out build/hud-artisan/pack
          python tools/hud_artisan/generate.py validate \
            --manifest "$MANIFEST" \
            --pack build/hud-artisan/pack --pixels --engine-contract
          python tools/hud_artisan/generate.py contact-sheet \
            --manifest "$MANIFEST" \
            --pack build/hud-artisan/pack \
            --out build/hud-artisan/contact-sheet.png

      - name: QA slow draft output
        if: inputs.scope == 'draft'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageStat
          jobs=json.loads(Path("build/hud-artisan/jobs/jobs.json").read_text())["jobs"]
          if len(jobs) != 1:
              raise SystemExit(f"Expected one draft job, got {len(jobs)}")
          job=jobs[0]
          image_path=Path("build/hud-artisan/drop") / job["output"]
          if not image_path.is_file():
              raise SystemExit(f"Draft output missing: {image_path}")
          with Image.open(image_path) as src:
              src.load()
              rgba=src.convert("RGBA")
          expected=(job["width"],job["height"])
          if rgba.size != expected:
              raise SystemExit(f"Wrong draft dimensions: {rgba.size}, expected {expected}")
          alpha=rgba.getchannel("A")
          if alpha.getbbox() is None:
              raise SystemExit("Draft is fully transparent")
          rgb=rgba.convert("RGB")
          variance=sum(ImageStat.Stat(rgb).var)/3
          colors=len(rgb.getcolors(maxcolors=1_000_000) or [])
          if variance < 12 or colors < 32:
              raise SystemExit(f"Draft looks blank/flat: variance={variance:.2f}, colors={colors}")
          tile=24
          preview=Image.new("RGB",(rgba.width,rgba.height))
          draw=ImageDraw.Draw(preview)
          for y in range(0,rgba.height,tile):
              for x in range(0,rgba.width,tile):
                  c=(112,112,112) if ((x//tile)+(y//tile))%2 else (176,176,176)
                  draw.rectangle((x,y,x+tile-1,y+tile-1),fill=c)
          preview.paste(rgba,mask=alpha)
          preview.save("build/hud-artisan/draft-preview.png")
          report={"status":"STRUCTURAL_DRAFT_PASS","asset":job["asset"],"file":job["output"],
                  "size":list(rgba.size),"alpha_extrema":list(alpha.getextrema()),
                  "rgb_variance_mean":round(variance,2),"unique_colors_sampled":colors,
                  "sha256":__import__("hashlib").sha256(image_path.read_bytes()).hexdigest(),
                  "note":"Structural checks only; visual art-direction approval is still required."}
          Path("build/hud-artisan/draft-qa.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload generated pack and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-artisan-comfyui-${{ github.run_number }}
          path: |
            build/hud-artisan/engine-profile.json
            build/hud-artisan/jobs/
            build/hud-artisan/drop/
            build/hud-artisan/pack/
            build/hud-artisan/contact-sheet.png
            build/hud-artisan/draft-preview.png
            build/hud-artisan/draft-qa.json
            comfyui.log
          if-no-files-found: warn
          retention-days: 14
